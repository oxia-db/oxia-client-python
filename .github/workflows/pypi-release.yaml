name: Publish to PyPI

on:
  push:
    tags:
      - v*

jobs:
  # The wheel carries a compiled extension module, so there is one per
  # platform. They are `abi3-py310`: one wheel per platform serves every
  # CPython from 3.10 on.
  wheels:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            compatibility: auto
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            compatibility: auto
          # musl, for Alpine — which is most of the container images an Oxia
          # client runs in. Without these a `pip install` there falls back to
          # the source distribution and needs a Rust toolchain to get going.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            compatibility: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            compatibility: musllinux_1_2
          - target: x86_64-apple-darwin
            runner: macos-latest
            compatibility: auto
          - target: aarch64-apple-darwin
            runner: macos-latest
            compatibility: auto

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Stamp the version from the tag
      run: ./.github/stamp-version.sh "${GITHUB_REF#refs/tags/v}"

    - name: Build wheel
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.compatibility }}
        args: --release --out dist

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.target }}
        path: dist

  sdist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Stamp the version from the tag
      run: ./.github/stamp-version.sh "${GITHUB_REF#refs/tags/v}"

    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi # Optional: use a GitHub environment for added security
    permissions:
      id-token: write # Required for OIDC authentication

    steps:
    - name: Collect the artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    # The build is what sets the version, from a file this workflow
    # rewrote. If that ever stops working, the artifacts are wrong rather
    # than missing, and an upload to PyPI cannot be taken back — so check
    # the names before publishing rather than after.
    - name: Check the artifacts carry the tag's version
      run: |
        version="${GITHUB_REF#refs/tags/v}"
        ls -1 dist/
        found=0
        for artifact in dist/*; do
          case "$(basename "$artifact")" in
            "oxia-${version}-"*.whl|"oxia-${version}.tar.gz") found=$((found + 1)) ;;
            *) echo "::error::$(basename "$artifact") is not version ${version}"; exit 1 ;;
          esac
        done
        # One wheel per entry of the matrix above, plus the sdist.
        if [ "$found" -ne 7 ]; then
          echo "::error::expected 6 wheels and the sdist, found ${found} artifacts"
          exit 1
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Publish packages to PyPI
      run: uv publish dist/*
