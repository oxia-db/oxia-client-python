[project]
name = "oxia"
description = "Oxia client for Python"
authors = [
    { name = "StreamNative"}
]
# Taken from the version in Cargo.toml, which the release workflow sets from
# the tag being released.
dynamic = ["version"]

requires-python = ">=3.13"

# The client itself is the native `oxia._oxia` module, built into the wheel.
dependencies = []

[dependency-groups]
dev = [
    "pydoctor>=25.10.1",
    "pytest>=8.4.2",
    "testcontainers>=4.13.1",
]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "oxia._oxia"
# `extension-module` leaves libpython to the interpreter that loads the
# module, which is what a wheel needs.
features = ["pyo3/extension-module"]
