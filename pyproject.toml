[project]
name = "oxia"
description = "Python client for Oxia, a scalable metadata store and coordination system"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "The Oxia Authors"}
]
# Taken from the version in Cargo.toml, which the release workflow sets from
# the tag being released.
dynamic = ["version"]

requires-python = ">=3.10"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
]

# The client itself is the native `oxia._oxia` module, built into the wheel.
dependencies = []

[project.urls]
Homepage = "https://oxia-db.github.io/"
Documentation = "https://oxia-db.github.io/oxia-client-python/latest/"
Repository = "https://github.com/oxia-db/oxia-client-python"
Issues = "https://github.com/oxia-db/oxia-client-python/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.13.1",
]
docs = [
    "pydoctor>=25.10.1",
]

# pydoctor pulls in cachecontrol[filecache] -> filelock, whose patched releases
# require Python 3.11+. Docs are only ever built on 3.13, so pinning the group
# keeps the 3.10 resolution free of the unpatchable filelock 4.1.0.
[tool.uv.dependency-groups]
docs = { requires-python = ">=3.13" }

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "oxia._oxia"
# `extension-module` leaves libpython to the interpreter that loads the
# module, which is what a wheel needs.
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["oxia"]

[tool.coverage.report]
show_missing = true
fail_under = 90
